<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>monkeytype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #323437;
      --sub:     #646669;
      --sub-alt: #2c2e31;
      --text:    #d1d0c5;
      --main:    #e2b714;
      --error:   #ca4754;
      --lh:      48px;   /* line height — must match JS LINE_HEIGHT */
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--sub);
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      user-select: none;
      overflow: hidden;
    }

    /* ── Drag bar ─────────────────────────────────────────── */
    #drag-bar {
      -webkit-app-region: drag;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--sub-alt);
      background: var(--bg);
      flex-shrink: 0;
    }

    /* lifetime totals — subtle, right-aligned in the drag bar */
    #lifetime {
      letter-spacing: 0.08em;
      color: var(--sub);
    }

    /* ── Banner ───────────────────────────────────────────── */
    #banner {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      flex-shrink: 0;
    }

    #banner.active {
      opacity: 1;
      pointer-events: auto;
    }

    #banner.working    { color: var(--sub); }
    #banner.done       { color: var(--main); }
    #banner.permission { color: var(--error); }

    /* personal-best flourish in the done banner */
    #banner .pb {
      color: var(--bg);
      background: var(--main);
      padding: 1px 8px;
      border-radius: 3px;
      font-weight: 500;
      letter-spacing: 0.04em;
      animation: pbPop 0.4s ease;
    }
    @keyframes pbPop {
      0%   { transform: scale(0.6); opacity: 0; }
      60%  { transform: scale(1.12); }
      100% { transform: scale(1);    opacity: 1; }
    }

    .btn {
      -webkit-app-region: no-drag;
      background: none;
      border: 1px solid currentColor;
      color: inherit;
      font-family: inherit;
      font-size: 11px;
      padding: 2px 10px;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 0.04em;
    }
    .btn:hover { background: rgba(255,255,255,0.07); }

    /* ── Game area ────────────────────────────────────────── */
    #game {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 48px 24px;
    }

    /* ── Words ────────────────────────────────────────────── */
    #words-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      height: calc(var(--lh) * 4);
      overflow: hidden;
      cursor: default;
    }

    #words {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      column-gap: 0.5em;
      width: 100%;
      transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    #words.dimmed { opacity: 0.3; transition: opacity 0.15s; }

    .word {
      display: inline-flex;
      height: var(--lh);
      align-items: center;
      position: relative;
    }

    /* word-level state — subtle underline for words completed wrong */
    .word.word-wrong::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 0; right: 0;
      height: 2px;
      background: var(--error);
      opacity: 0.4;
      border-radius: 1px;
    }

    /* entrance animation for rows scrolling into view at the bottom */
    @keyframes lineEnter {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .word.line-enter {
      animation: lineEnter 250ms ease forwards;
    }

    .char {
      color: var(--sub);
      font-size: 22px;
      line-height: var(--lh);
    }

    .char.correct { color: var(--main); }
    .char.wrong   { color: var(--error); }
    .char.extra   { color: var(--error); opacity: 0.5; font-size: 19px; }
    .char.missed  { color: var(--error); opacity: 0.3; }

    /* ── Caret ────────────────────────────────────────────── */
    #caret {
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 30px;       /* ~0.65 × lh */
      background: var(--main);
      border-radius: 2px;
      pointer-events: none;
      transform: translate(0, 9px);   /* vertical centering offset = (lh - height) / 2 */
      transition: transform 80ms ease, opacity 0.1s;
      animation: caretBlink 1.1s step-end infinite;
    }

    @keyframes caretBlink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    #caret.typing { animation: none; opacity: 1; }

    /* ── Stats ────────────────────────────────────────────── */
    #stats {
      display: flex;
      gap: 40px;
      margin-top: 28px;
      opacity: 0;
      transition: opacity 0.3s;
      height: 52px;
    }

    #stats.visible { opacity: 1; }

    .stat-label {
      font-size: 11px;
      color: var(--sub);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 26px;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    body {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

<div id="drag-bar"><span>monkeytype</span><span id="lifetime"></span></div>
<div id="banner"></div>

<div id="game">
  <div id="words-wrapper">
    <div id="words"></div>
    <div id="caret"></div>
  </div>

  <div id="stats">
    <div>
      <div class="stat-label">wpm</div>
      <div class="stat-value" id="s-wpm">0</div>
    </div>
    <div>
      <div class="stat-label">raw</div>
      <div class="stat-value" id="s-raw">0</div>
    </div>
    <div>
      <div class="stat-label">acc</div>
      <div class="stat-value" id="s-acc">100%</div>
    </div>
  </div>
</div>

<script>
// ── Word pool (500 words, frequency-based) ────────────────────────────────────
const WORD_LIST = [
  "the","be","to","of","and","a","in","that","have","it","for","not","on","with",
  "he","as","you","do","at","this","but","his","by","from","they","we","say","her",
  "she","or","an","will","my","one","all","would","there","their","what","so","up",
  "out","if","about","who","get","which","go","me","when","make","can","like","time",
  "no","just","him","know","take","people","into","year","your","good","some","could",
  "them","see","other","than","then","now","look","only","come","over","think","also",
  "back","after","use","two","how","our","work","first","well","way","even","new",
  "want","because","any","these","give","day","most","us","between","need","large",
  "often","hand","high","place","hold","turn","here","why","ask","went","men","read",
  "land","home","move","try","kind","still","learn","plant","cover","food","sun",
  "keep","eye","never","last","let","city","tree","run","while","press","close",
  "night","real","life","few","open","seem","together","next","white","walk","paper",
  "group","always","music","those","book","carry","took","science","eat","room",
  "friend","idea","fish","stop","once","hear","horse","cut","sure","watch","color",
  "face","wood","main","enough","girl","young","ready","above","ever","point","play",
  "spell","air","away","animal","house","page","letter","mother","answer","found",
  "study","change","off","state","story","saw","far","sea","draw","left","late",
  "begin","got","walk","example","ease","paper","group","always","music","those",
  "both","mark","book","often","letter","until","mile","river","car","feet","care",
  "second","enough","plain","girl","usual","young","ready","above","ever","parts",
  "reach","build","stay","light","voice","power","town","fine","drive","stood",
  "front","teach","week","final","gave","green","oh","quick","develop","ocean",
  "warm","free","minute","strong","special","behind","clear","tail","produce","fact",
  "street","inch","lot","nothing","course","stay","wheel","full","force","blue",
  "object","decide","surface","deep","moon","island","foot","yet","busy","test",
  "record","boat","common","gold","possible","plane","age","dry","wonder","laugh",
  "thousand","ago","ran","check","game","shape","miss","heat","snow","bed","bring",
  "sit","perhaps","fill","east","weight","language","among","everything","floor",
  "yet","himself","toward","fifth","store","love","term","table","total","base",
  "smell","valley","nor","double","seat","arrive","master","track","parent","shore",
  "division","sheet","substance","favor","connect","post","spend","chord","fat",
  "glad","original","share","station","dad","bread","charge","proper","bar","offer",
  "segment","slave","duck","instant","market","degree","populate","chick","dear",
  "enemy","reply","drink","occur","support","speech","nature","range","steam",
  "motion","path","liquid","log","meant","quotient","teeth","shell","neck","oxygen",
  "sugar","death","pretty","skill","women","season","solution","magnet","silver",
  "thank","branch","match","suffix","especially","fig","afraid","huge","sister",
  "steel","discuss","forward","similar","guide","experience","score","apple","bought",
  "led","pitch","coat","mass","card","band","rope","slip","win","dream","evening",
  "condition","feed","tool","total","basic","smell","valley","nor","double","seat",
  "symbol","direct","pose","create","charge","property","column","molecule","select",
  "wrong","gray","repeat","require","broad","prepare","salt","nose","plural","anger",
  "claim","continent","odd","instead","phrase","soil","bed","copy","free","hope",
  "spring","case","laugh","nation","quite","type","themselves","temperature","bright",
  "lead","everyone","method","section","lake","iron","within","dictionary","hair",
  "age","amount","scale","pounds","although","per","broken","moment","tiny","possible",
  "gold","milk","quiet","natural","lot","stone","act","build","middle","speed",
  "count","cat","someone","sail","rolled","bear","wonder","smiled","angle","fraction",
  "africa","killed","melody","bottom","trip","hole","poor","let","fight","surprise",
  "french","died","beat","exactly","remain","dress","iron","couldn","fingers","row",
  "least","catch","climbed","wrote","shouted","continued","itself","else","plains",
  "gas","england","burning","design","joined","foot","law","ears","glass","grew"
];

// ── Circular shuffle generator ────────────────────────────────────────────────
let shuffled = [];
let shuffleIdx = 0;

function initPool() {
  shuffled = [...WORD_LIST].sort(() => Math.random() - 0.5);
  shuffleIdx = 0;
}

function nextWord() {
  if (shuffleIdx >= shuffled.length) {
    const last = shuffled[shuffled.length - 1];
    shuffled = [...WORD_LIST].sort(() => Math.random() - 0.5);
    // Avoid the last word appearing at position 0 of the new shuffle
    if (shuffled[0] === last) {
      const swap = Math.floor(Math.random() * (shuffled.length - 1)) + 1;
      [shuffled[0], shuffled[swap]] = [shuffled[swap], shuffled[0]];
    }
    shuffleIdx = 0;
  }
  return shuffled[shuffleIdx++];
}

// ── DOM refs ──────────────────────────────────────────────────────────────────
const wordsEl   = document.getElementById('words');
const wrapperEl = document.getElementById('words-wrapper');
const caretEl   = document.getElementById('caret');
const statsEl   = document.getElementById('stats');
const bannerEl  = document.getElementById('banner');
const sWpm      = document.getElementById('s-wpm');
const sRaw      = document.getElementById('s-raw');
const sAcc      = document.getElementById('s-acc');
const lifetimeEl = document.getElementById('lifetime');

// ── Game state ────────────────────────────────────────────────────────────────
const WORDS_INITIAL  = 100;
const WORDS_ADD      = 50;
const WORDS_AHEAD    = 30;   // add more words when this many remain
const LINE_HEIGHT    = 48;   // must match CSS --lh
const VISIBLE_LINES  = 4;
const IDLE_MS        = 2000;   // typing-burst / idle-reset threshold

let wordEls    = [];
let wIdx       = 0;
let cIdx       = 0;

let started    = false;
let startTime  = 0;
let correctCh  = 0;
let totalCh    = 0;
let wordsOk    = 0;

// session totals — survive idle resets; banked to storage once per Claude turn
let sessWords     = 0;
let sessCorrectCh = 0;
let sessTotalCh   = 0;
let sessTypingMs  = 0;
let lastKeyTime   = 0;
let lastSummary   = null;   // most recent finished session, for the done banner
let hiddenBy      = null;   // why the panel is hidden: 'user' (Enter/Esc) | 'auto' (permission) | null

let idleTimer         = null;
let caretTimer        = null;
let inputEnabled      = true;
let translateY        = 0;
let statsInterval     = null;
let presentedBottomRow = 0;  // highest bottom-row offsetTop shown without animation

// ── Word rendering ────────────────────────────────────────────────────────────
function createWordEl(word) {
  const div = document.createElement('div');
  div.className = 'word';
  div.dataset.word = word;
  for (const ch of word) {
    const s = document.createElement('span');
    s.className = 'char';
    s.textContent = ch;
    div.appendChild(s);
  }
  return div;
}

function addWords(count) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const el = createWordEl(nextWord());
    wordEls.push(el);
    frag.appendChild(el);
  }
  wordsEl.appendChild(frag);
}

// ── Scroll adjustment ─────────────────────────────────────────────────────────
function adjustScroll() {
  const wordEl = wordEls[wIdx];
  if (!wordEl) return;

  const top    = wordEl.offsetTop;
  const target = Math.max(0, top - LINE_HEIGHT); // keep active word on 2nd visible row

  if (target !== translateY) {
    translateY = target;
    wordsEl.style.transform = `translateY(-${translateY}px)`;

    // Animate the new bottom row into view (fade + slide up)
    const newBottomRow = translateY + (VISIBLE_LINES - 1) * LINE_HEIGHT;
    if (newBottomRow > presentedBottomRow) {
      presentedBottomRow = newBottomRow;
      for (const el of wordEls) {
        if (Math.abs(el.offsetTop - newBottomRow) < 4) {
          el.classList.remove('line-enter');
          void el.offsetWidth; // force reflow to restart animation
          el.classList.add('line-enter');
        }
      }
    }
  }
}

// ── Caret positioning ─────────────────────────────────────────────────────────
function updateCaret() {
  const wordEl = wordEls[wIdx];
  if (!wordEl) return;

  const allChars = wordEl.querySelectorAll('.char');
  let targetChar = allChars[cIdx] ?? allChars[allChars.length - 1];
  if (!targetChar) return;

  const wrapRect = wrapperEl.getBoundingClientRect();
  const charRect = targetChar.getBoundingClientRect();

  let x = charRect.left - wrapRect.left;
  let y = charRect.top  - wrapRect.top;

  // If caret is after the last char, place it at right edge
  if (cIdx >= allChars.length) x += charRect.width;

  const caretTop = (LINE_HEIGHT - 30) / 2; // vertical centering of 30px caret in 48px row
  caretEl.style.transform = `translate(${x - 1}px, ${y + caretTop}px)`;

  // Restart blink animation reset
  clearTimeout(caretTimer);
  caretEl.classList.add('typing');
  caretTimer = setTimeout(() => caretEl.classList.remove('typing'), 500);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats() {
  if (!started) return;
  const elapsed = (Date.now() - startTime) / 60000;
  if (elapsed <= 0) return;

  const wpm = Math.round((correctCh / 5) / elapsed);
  const raw = Math.round((totalCh   / 5) / elapsed);
  const acc = totalCh > 0 ? Math.round((correctCh / totalCh) * 100) : 100;

  sWpm.textContent = wpm;
  sRaw.textContent = raw;
  sAcc.textContent = acc + '%';
}

// ── Session totals + persistence ──────────────────────────────────────────────
// The per-burst counters above reset on idle. These accumulate across the whole
// Claude turn and are banked to localStorage when the turn ends, so wpm/words
// progress persists between sessions and there's a personal best to chase.
const STORE_KEY = 'monkeytype.stats.v1';

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}

function saveStore(store) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {}
}

function sessionSummary() {
  const minutes = sessTypingMs / 60000;
  const wpm = minutes > 0 ? Math.round((sessCorrectCh / 5) / minutes) : 0;
  const acc = sessTotalCh > 0 ? Math.round((sessCorrectCh / sessTotalCh) * 100) : 100;
  return { words: sessWords, wpm, acc, newBest: false };
}

function resetSession() {
  sessWords = sessCorrectCh = sessTotalCh = sessTypingMs = 0;
  lastKeyTime = 0;
}

// Bank the current session into lifetime storage. Returns its summary (with a
// newBest flag) when there was typing to record, else null. Idempotent: it
// clears the session, so a repeated call (e.g. a second `done`) records nothing.
function commitSession() {
  if (sessTotalCh === 0) return null;
  const summary = sessionSummary();
  const store = loadStore();
  store.lifetimeWords = (store.lifetimeWords || 0) + summary.words;
  if (summary.words >= 10 && summary.wpm > (store.bestWpm || 0)) {
    store.bestWpm = summary.wpm;
    summary.newBest = true;
  }
  saveStore(store);
  resetSession();
  updateLifetimeDisplay();
  return summary;
}

function updateLifetimeDisplay() {
  const store = loadStore();
  const parts = [];
  if (store.bestWpm)       parts.push('best ' + store.bestWpm);
  if (store.lifetimeWords) parts.push(store.lifetimeWords.toLocaleString() + ' words');
  lifetimeEl.textContent = parts.join('  ·  ');
}

// ── Idle reset (2 s) ──────────────────────────────────────────────────────────
function resetIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(hardReset, IDLE_MS);
}

function hardReset() {
  clearInterval(statsInterval);
  statsInterval = null;
  started    = false;
  correctCh  = 0;
  totalCh    = 0;
  wordsOk    = 0;
  wIdx       = 0;
  cIdx       = 0;
  translateY = 0;
  inputEnabled = true;

  wordEls = [];
  wordsEl.innerHTML = '';
  wordsEl.style.transform = '';

  statsEl.classList.remove('visible');
  sWpm.textContent = '0';
  sRaw.textContent = '0';
  sAcc.textContent = '100%';

  addWords(WORDS_INITIAL);
  // Mark the initial visible rows as already presented — they don't animate in
  presentedBottomRow = (VISIBLE_LINES - 1) * LINE_HEIGHT;
  updateCaret();
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  const key = e.key;

  // Enter / Escape hide the panel from any state — there is never a moment you
  // can't dismiss it from the keyboard. The next prompt brings it back.
  if (key === 'Enter' || key === 'Escape') {
    e.preventDefault();
    hiddenBy = 'user';
    bridge('hide');
    return;
  }

  if (!inputEnabled) return;

  if (key === 'Tab') { e.preventDefault(); hardReset(); return; }

  if (key === 'Backspace') {
    e.preventDefault();
    handleBackspace();
    return;
  }

  if (key === ' ') {
    e.preventDefault();
    handleSpace();
    return;
  }

  if (key.length !== 1) return;
  e.preventDefault();
  handleChar(key);
});

function handleChar(key) {
  if (!started) {
    started   = true;
    startTime = Date.now();
    statsEl.classList.add('visible');
    statsInterval = setInterval(updateStats, 250);
  }

  resetIdle();
  totalCh++;

  // session accumulation — independent of idle resets; banked per Claude turn.
  // Only intervals shorter than the idle threshold count toward typing time, so
  // pauses between bursts don't deflate the session wpm.
  const now = Date.now();
  if (lastKeyTime && now - lastKeyTime < IDLE_MS) sessTypingMs += now - lastKeyTime;
  lastKeyTime = now;
  sessTotalCh++;

  const wordEl  = wordEls[wIdx];
  const word    = wordEl.dataset.word;
  const nonExtra = wordEl.querySelectorAll('.char:not(.extra)');

  if (cIdx < nonExtra.length) {
    const charEl = nonExtra[cIdx];
    if (key === word[cIdx]) {
      charEl.className = 'char correct';
      correctCh++;
      sessCorrectCh++;
    } else {
      charEl.className = 'char wrong';
    }
  } else {
    // Extra character past end of word — capped at 10 extras to prevent runaway
    const extras = wordEl.querySelectorAll('.extra');
    if (extras.length < 10) {
      const ex = document.createElement('span');
      ex.className = 'char extra';
      ex.textContent = key;
      wordEl.appendChild(ex);
    }
  }

  cIdx++;
  updateCaret();
}

function handleSpace() {
  if (wIdx >= wordEls.length - 1) return;
  resetIdle();

  const wordEl   = wordEls[wIdx];
  const word     = wordEl.dataset.word;
  const nonExtra = wordEl.querySelectorAll('.char:not(.extra)');
  const extras   = wordEl.querySelectorAll('.extra');
  const wrongs   = wordEl.querySelectorAll('.wrong, .extra, .missed');

  // Mark any untyped chars as missed
  for (let i = cIdx; i < nonExtra.length; i++) {
    nonExtra[i].className = 'char missed';
  }

  if (wrongs.length === 0 && cIdx >= word.length) {
    wordEl.classList.add('word-correct');
    wordsOk++;
    sessWords++;
  } else {
    wordEl.classList.add('word-wrong');
  }

  wIdx++;
  cIdx = 0;

  adjustScroll();
  updateCaret();

  // Lazy-load more words
  if (wordEls.length - wIdx < WORDS_AHEAD) addWords(WORDS_ADD);

  if (started) updateStats();
}

function handleBackspace() {
  resetIdle();

  const wordEl   = wordEls[wIdx];
  const nonExtra = wordEl.querySelectorAll('.char:not(.extra)');
  const extras   = wordEl.querySelectorAll('.extra');

  if (extras.length > 0 && cIdx > nonExtra.length) {
    extras[extras.length - 1].remove();
    cIdx--;
  } else if (cIdx > 0) {
    nonExtra[cIdx - 1].className = 'char';
    cIdx--;
  } else if (wIdx > 0) {
    // Go back to previous word
    wordEl.classList.remove('word-correct', 'word-wrong');
    wIdx--;

    const prevEl = wordEls[wIdx];
    prevEl.classList.remove('word-correct', 'word-wrong');

    // Remove extra chars from previous word
    prevEl.querySelectorAll('.extra').forEach(e => e.remove());

    // Reset missed chars back to default
    prevEl.querySelectorAll('.missed').forEach(c => { c.className = 'char'; });

    // Position caret at end of the previous word's typed chars
    const prevNonExtra = prevEl.querySelectorAll('.char:not(.extra)');
    let lastTyped = 0;
    for (let i = prevNonExtra.length - 1; i >= 0; i--) {
      if (prevNonExtra[i].classList.contains('correct') || prevNonExtra[i].classList.contains('wrong')) {
        lastTyped = i + 1;
        break;
      }
    }
    cIdx = lastTyped;

    adjustScroll();
  }

  updateCaret();
  if (started) updateStats();
}

// ── Native panel bridge ───────────────────────────────────────────────────────
// Talks to the Swift shell via the WKWebView script-message handler named
// "panel". No-op in a plain browser, so the game still runs standalone for dev.
function bridge(cmd) {
  window.webkit?.messageHandlers?.panel?.postMessage(cmd);
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function connectWS() {
  let ws;
  const host = location.host || 'localhost:3000';
  try { ws = new WebSocket('ws://' + host); } catch { return; }

  ws.addEventListener('message', e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    if (msg.type === 'control' && msg.value === 'quit') { commitSession(); bridge('quit'); return; }
    if (msg.type !== 'status') return;

    switch (msg.value) {
      case 'working':
        hideBanner();
        inputEnabled = true;
        wordsEl.classList.remove('dimmed');
        if (msg.show) {                 // new prompt → bank the prior turn, surface the panel
          commitSession();
          lastSummary = null;
          hiddenBy = null;
          bridge('show');
        } else if (hiddenBy === 'auto') {
          // Resumed after a permission prompt we auto-hid for — come back, but
          // without taking the keyboard; the user may be mid-action in the terminal.
          hiddenBy = null;
          bridge('show-nokey');
        }
        break;
      case 'done': {
        // Bank and render the summary even if the panel is hidden: it waits there
        // silently (no re-show) and is replaced when the next prompt arrives.
        const summary = commitSession();
        if (summary) lastSummary = summary;
        showDoneBanner(lastSummary);
        inputEnabled = true;
        wordsEl.classList.remove('dimmed');
        break;
      }
      case 'permission':
        // Hide so the keyboard snaps back to the terminal and the user can answer
        // without clicking anything. A prior manual dismissal stays manual.
        showBanner('permission', '— waiting for your input');
        inputEnabled = false;
        wordsEl.classList.add('dimmed');
        if (!hiddenBy) hiddenBy = 'auto';
        bridge('hide');
        break;
    }
  });

  ws.addEventListener('close', () => setTimeout(connectWS, 3000));
  ws.addEventListener('error', () => {});
}

function hideBanner() {
  bannerEl.className = '';
  bannerEl.innerHTML = '';
}

function showBanner(cls, text) {
  bannerEl.className = 'active ' + cls;
  bannerEl.textContent = text;
}

function showDoneBanner(summary) {
  bannerEl.className = 'active done';
  bannerEl.innerHTML = '';

  const label = document.createElement('span');
  label.textContent = summary
    ? `— claude is done  ·  ${summary.words} words  ·  ${summary.wpm} wpm  ·  ${summary.acc}%`
    : '— claude is done';
  bannerEl.appendChild(label);

  if (summary && summary.newBest) {
    const pb = document.createElement('span');
    pb.className = 'pb';
    pb.textContent = 'new best!';
    bannerEl.appendChild(pb);
  }

  const keepBtn = document.createElement('button');
  keepBtn.className = 'btn';
  keepBtn.textContent = 'keep typing';
  keepBtn.onclick = hideBanner;

  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn';
  closeBtn.textContent = 'close';
  closeBtn.onclick = () => bridge('hide');

  bannerEl.append(keepBtn, closeBtn);
}

// ── Init ──────────────────────────────────────────────────────────────────────
initPool();
addWords(WORDS_INITIAL);
// Wait one frame for layout, then position caret and mark initial rows as presented
requestAnimationFrame(() => {
  presentedBottomRow = (VISIBLE_LINES - 1) * LINE_HEIGHT;
  updateCaret();
});
updateLifetimeDisplay();
connectWS();
</script>
