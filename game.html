<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>monkeytype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #323437;
      color: #646669;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      overflow-x: hidden;
    }

    /* ── Banner ── */
    #banner {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 13px;
      padding: 8px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #banner.active {
      opacity: 1;
      pointer-events: auto;
    }

    #banner.working    { color: #646669; }
    #banner.done       { color: #e2b714; }
    #banner.permission { color: #ca4754; }

    .btn {
      background: none;
      border: 1px solid currentColor;
      color: inherit;
      font-family: inherit;
      font-size: 12px;
      padding: 3px 12px;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 0.03em;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.07); }

    /* ── Layout ── */
    #game {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      max-width: 860px;
      padding: 0 40px 80px;
    }

    /* ── Words ── */
    #word-area {
      width: 100%;
      font-size: 1.5rem;
      line-height: 2.2;
      transition: opacity 0.15s;
    }

    #word-area.dimmed {
      opacity: 0.3;
    }

    .word {
      display: inline-block;
      margin-right: 0.45em;
      white-space: nowrap;
    }

    .char {
      position: relative;
      color: #646669;
    }

    .char.correct { color: #e2b714; }
    .char.wrong   { color: #ca4754; text-decoration: underline; }

    /* Blinking caret before the current character */
    .char.cursor::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 12%;
      bottom: 12%;
      width: 2px;
      background: #e2b714;
      border-radius: 1px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Stats ── */
    #stats {
      display: flex;
      gap: 48px;
      margin-top: 32px;
      opacity: 0;
      transition: opacity 0.25s;
    }

    #stats.visible { opacity: 1; }

    .stat-label {
      font-size: 11px;
      color: #4c4f52;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .stat-value {
      font-size: 1.5rem;
      color: #d1d0c5;
    }
  </style>
</head>
<body>

<div id="banner"></div>

<div id="game">
  <div id="word-area"></div>
  <div id="stats">
    <div>
      <div class="stat-label">wpm</div>
      <div class="stat-value" id="s-wpm">0</div>
    </div>
    <div>
      <div class="stat-label">acc</div>
      <div class="stat-value" id="s-acc">100%</div>
    </div>
    <div>
      <div class="stat-label">words</div>
      <div class="stat-value" id="s-words">0</div>
    </div>
  </div>
</div>

<script>
// ── Word pool (200 words) ─────────────────────────────────────────────────
const POOL = [
  "the","be","to","of","and","a","in","that","have","it",
  "for","not","on","with","he","as","you","do","at","this",
  "but","his","by","from","they","we","say","her","she","or",
  "an","will","my","one","all","would","there","their","what","so",
  "up","out","if","about","who","get","which","go","me","when",
  "make","can","like","time","no","just","him","know","take","people",
  "into","year","your","good","some","could","them","see","other","than",
  "then","now","look","only","come","over","think","also","back","after",
  "use","two","how","our","work","first","well","way","even","new",
  "want","because","any","these","give","day","most","us","between","need",
  "large","often","hand","high","place","hold","turn","here","why","ask",
  "went","men","read","land","home","move","try","kind","still","learn",
  "plant","cover","food","sun","keep","eye","never","last","let","city",
  "tree","run","while","press","close","night","real","life","few","open",
  "seem","together","next","white","walk","paper","group","always","music","those",
  "book","carry","took","science","eat","room","friend","idea","fish","stop",
  "once","hear","horse","cut","sure","watch","color","face","wood","main",
  "enough","girl","young","ready","above","ever","point","play","spell","air",
  "away","animal","house","page","letter","mother","answer","found","study","change",
  "off","state","story","saw","far","sea","draw","left","late","begin"
];

// ── DOM refs ──────────────────────────────────────────────────────────────
const wordArea = document.getElementById('word-area');
const statsEl  = document.getElementById('stats');
const sWpm     = document.getElementById('s-wpm');
const sAcc     = document.getElementById('s-acc');
const sWords   = document.getElementById('s-words');
const banner   = document.getElementById('banner');

// ── Game state ────────────────────────────────────────────────────────────
let lineWords  = [];
let charStates = []; // charStates[wi][ci]: '' | 'correct' | 'wrong'
let wIdx = 0;
let cIdx = 0;

let started   = false;
let startTime = 0;
let correctCh = 0;
let totalCh   = 0;
let doneWords = 0;

let idleTimer = null;
let inputOff  = false;

// ── Line generation ───────────────────────────────────────────────────────
function newLine() {
  const shuffled = [...POOL].sort(() => Math.random() - 0.5);
  lineWords  = shuffled.slice(0, 50);
  charStates = lineWords.map(w => Array(w.length).fill(''));
  wIdx = 0;
  cIdx = 0;
  renderLine();
}

// ── Render ────────────────────────────────────────────────────────────────
function renderLine() {
  wordArea.innerHTML = '';

  lineWords.forEach((word, wi) => {
    const wSpan = document.createElement('span');
    wSpan.className = 'word';

    word.split('').forEach((ch, ci) => {
      const s = document.createElement('span');
      s.className = 'char';
      const st = charStates[wi][ci];
      if (st === 'correct') s.classList.add('correct');
      else if (st === 'wrong') s.classList.add('wrong');
      if (wi === wIdx && ci === cIdx) s.classList.add('cursor');
      s.textContent = ch;
      wSpan.appendChild(s);
    });

    // Cursor sitting after the last char of the current word
    if (wi === wIdx && cIdx === word.length) {
      const end = document.createElement('span');
      end.className = 'char cursor';
      end.style.cssText = 'display:inline-block;width:1px;overflow:visible;';
      wSpan.appendChild(end);
    }

    wordArea.appendChild(wSpan);
  });
}

// ── Stats ─────────────────────────────────────────────────────────────────
function updateStats() {
  const elapsed = (Date.now() - startTime) / 60000; // minutes
  const wpm = elapsed > 0 ? Math.round((correctCh / 5) / elapsed) : 0;
  const acc = totalCh  > 0 ? Math.round((correctCh / totalCh) * 100) : 100;
  sWpm.textContent   = wpm;
  sAcc.textContent   = acc + '%';
  sWords.textContent = doneWords;
}

// ── Idle reset (2 s) ──────────────────────────────────────────────────────
function resetIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    started   = false;
    correctCh = 0;
    totalCh   = 0;
    doneWords = 0;
    statsEl.classList.remove('visible');
    sWpm.textContent   = '0';
    sAcc.textContent   = '100%';
    sWords.textContent = '0';
    newLine();
  }, 2000);
}

// ── Input ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (inputOff) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  const key = e.key;

  if (key === 'Backspace') {
    e.preventDefault();
    if (cIdx > 0) {
      cIdx--;
      charStates[wIdx][cIdx] = '';
    } else if (wIdx > 0) {
      doneWords = Math.max(0, doneWords - 1);
      wIdx--;
      cIdx = lineWords[wIdx].length;
    }
    renderLine();
    if (started) updateStats();
    resetIdle();
    return;
  }

  if (key === ' ') {
    e.preventDefault();
    if (wIdx >= lineWords.length - 1) return;
    doneWords++;
    wIdx++;
    cIdx = 0;
    renderLine();
    if (started) updateStats();
    resetIdle();
    return;
  }

  if (key.length !== 1) return;
  e.preventDefault();

  // Don't allow typing past the end of the last character in the current word
  if (cIdx >= lineWords[wIdx].length) return;

  if (!started) {
    started   = true;
    startTime = Date.now();
    statsEl.classList.add('visible');
  }

  totalCh++;
  if (key === lineWords[wIdx][cIdx]) {
    charStates[wIdx][cIdx] = 'correct';
    correctCh++;
  } else {
    charStates[wIdx][cIdx] = 'wrong';
  }
  cIdx++;

  renderLine();
  updateStats();
  resetIdle();
});

// ── WebSocket ─────────────────────────────────────────────────────────────
function connectWS() {
  let ws;
  try { ws = new WebSocket('ws://localhost:3000'); }
  catch { return; }

  ws.addEventListener('message', e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type !== 'status') return;

    switch (msg.value) {
      case 'working':
        showBanner('working', '— claude is working');
        restoreInput();
        break;
      case 'done':
        showDoneBanner();
        restoreInput();
        break;
      case 'permission':
        showBanner('permission', '— waiting for permission');
        wordArea.classList.add('dimmed');
        inputOff = true;
        break;
      case 'resume':
        showBanner('working', '— claude is working');
        restoreInput();
        break;
    }
  });

  ws.addEventListener('close', () => setTimeout(connectWS, 3000));
  ws.addEventListener('error', () => {});
}

function restoreInput() {
  wordArea.classList.remove('dimmed');
  inputOff = false;
}

function showBanner(cls, text) {
  banner.className = 'active ' + cls;
  banner.textContent = text;
}

function showDoneBanner() {
  banner.className = 'active done';
  banner.innerHTML = '';

  const label = document.createElement('span');
  label.textContent = '— claude is done';

  const keepBtn = document.createElement('button');
  keepBtn.className = 'btn';
  keepBtn.textContent = 'keep typing';
  keepBtn.addEventListener('click', () => {
    banner.className = '';
    banner.innerHTML = '';
  });

  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn';
  closeBtn.textContent = 'close';
  closeBtn.addEventListener('click', () => window.close());

  banner.append(label, keepBtn, closeBtn);
}

// ── Init ──────────────────────────────────────────────────────────────────
newLine();
connectWS();
</script>

</body>
</html>
